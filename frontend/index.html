<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px 15px;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .hidden {
            display: none !important;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #eee;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .auth-tab.active {
            background: #667eea;
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #667eea;
            color: white;
            margin-top: 5px;
        }

        .primary-btn:hover {
            background: #5568d9;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .status.success {
            display: block;
            background: #e8f8ee;
            color: #16803c;
        }

        .status.error {
            display: block;
            background: #fdecec;
            color: #c62828;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #f5f5ff;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .username {
            font-weight: bold;
            color: #667eea;
        }

        .logout-btn {
            padding: 9px 14px;
            border-radius: 9px;
            background: #ef5350;
            color: white;
        }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-form input {
            flex: 1;
        }

        .add-btn {
            padding: 0 20px;
            border-radius: 12px;
            background: #667eea;
            color: white;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            flex: 1;
            background: #f7f7f7;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 13px;
            color: #777;
            margin-top: 4px;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #eee;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .todo-title {
            flex: 1;
            word-break: break-word;
        }

        .todo-actions {
            display: flex;
            gap: 7px;
        }

        .edit-btn,
        .delete-btn {
            padding: 8px 10px;
            border-radius: 8px;
            color: white;
        }

        .edit-btn {
            background: #42a5f5;
        }

        .delete-btn {
            background: #ef5350;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 30px 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .card {
                padding: 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 27px;
            }

            .add-form {
                flex-direction: column;
            }

            .add-btn {
                padding: 14px;
            }

            .todo-item {
                align-items: flex-start;
            }

            .todo-actions {
                flex-direction: column;
            }

            .user-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .logout-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- GİRİŞ / KAYIT -->
    <div id="authSection" class="card">

        <h1>📝 To-Do List</h1>
        <p class="subtitle">Görevlerini düzenle ve takip et.</p>

        <div class="auth-tabs">
            <button id="loginTab" class="auth-tab active">
                Giriş Yap
            </button>

            <button id="registerTab" class="auth-tab">
                Kayıt Ol
            </button>
        </div>

        <form id="authForm">

            <div class="form-group">
                <label for="authUsername">
                    Kullanıcı adı
                </label>

                <input
                    id="authUsername"
                    type="text"
                    minlength="3"
                    maxlength="50"
                    required
                    autocomplete="username"
                    placeholder="Kullanıcı adınız"
                >
            </div>

            <div class="form-group">
                <label for="authPassword">
                    Şifre
                </label>

                <input
                    id="authPassword"
                    type="password"
                    minlength="6"
                    maxlength="128"
                    required
                    autocomplete="current-password"
                    placeholder="Şifreniz"
                >
            </div>

            <button
                id="authButton"
                class="primary-btn"
                type="submit"
            >
                Giriş Yap
            </button>

        </form>

        <div id="authStatus" class="status"></div>

    </div>


    <!-- TODO UYGULAMASI -->
    <div id="todoSection" class="card hidden">

        <h1>📝 To-Do List</h1>

        <div class="user-bar">
            <div>
                Hoş geldin,
                <span id="usernameDisplay" class="username"></span> 👋
            </div>

            <button
                id="logoutButton"
                class="logout-btn"
                type="button"
            >
                Çıkış Yap
            </button>
        </div>


        <form id="todoForm" class="add-form">

            <input
                id="todoInput"
                type="text"
                maxlength="500"
                placeholder="Yeni görev yaz..."
                required
            >

            <button
                class="add-btn"
                type="submit"
            >
                Ekle
            </button>

        </form>


        <div id="todoStatus" class="status"></div>


        <div class="stats">

            <div class="stat">
                <div
                    id="totalCount"
                    class="stat-number"
                >
                    0
                </div>

                <div class="stat-label">
                    Toplam
                </div>
            </div>

            <div class="stat">
                <div
                    id="completedCount"
                    class="stat-number"
                >
                    0
                </div>

                <div class="stat-label">
                    Tamamlandı
                </div>
            </div>

            <div class="stat">
                <div
                    id="remainingCount"
                    class="stat-number"
                >
                    0
                </div>

                <div class="stat-label">
                    Kalan
                </div>
            </div>

        </div>


        <div id="loading" class="loading hidden">
            Görevler yükleniyor...
        </div>


        <ul
            id="todoList"
            class="todo-list"
        ></ul>

    </div>

</div>


<script>

const API_URL = "https://todo-api-znqf.onrender.com";

const TOKEN_KEY = "todo_token";
const USERNAME_KEY = "todo_username";

let todos = [];
let isRegisterMode = false;


const authSection = document.getElementById("authSection");
const todoSection = document.getElementById("todoSection");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const authForm = document.getElementById("authForm");
const authUsername = document.getElementById("authUsername");
const authPassword = document.getElementById("authPassword");
const authButton = document.getElementById("authButton");
const authStatus = document.getElementById("authStatus");

const usernameDisplay = document.getElementById("usernameDisplay");
const logoutButton = document.getElementById("logoutButton");

const todoForm = document.getElementById("todoForm");
const todoInput = document.getElementById("todoInput");
const todoStatus = document.getElementById("todoStatus");

const todoList = document.getElementById("todoList");
const loading = document.getElementById("loading");

const totalCount = document.getElementById("totalCount");
const completedCount = document.getElementById("completedCount");
const remainingCount = document.getElementById("remainingCount");


function getToken() {
    return localStorage.getItem(TOKEN_KEY);
}


function getUsername() {
    return localStorage.getItem(USERNAME_KEY);
}


function showStatus(element, message, type) {
    element.textContent = message;
    element.className = "status " + type;
}


function clearStatus(element) {
    element.textContent = "";
    element.className = "status";
}


function showAuth() {
    authSection.classList.remove("hidden");
    todoSection.classList.add("hidden");

    authUsername.value = "";
    authPassword.value = "";

    clearStatus(todoStatus);
}


function showTodos() {
    authSection.classList.add("hidden");
    todoSection.classList.remove("hidden");

    usernameDisplay.textContent = getUsername() || "";

    loadTodos();
}


function logout() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USERNAME_KEY);

    todos = [];

    renderTodos();

    showAuth();

    showStatus(
        authStatus,
        "Çıkış yapıldı.",
        "success"
    );
}


function handleUnauthorized() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USERNAME_KEY);

    todos = [];

    renderTodos();

    showAuth();

    showStatus(
        authStatus,
        "Oturumunuz sona erdi. Tekrar giriş yapın.",
        "error"
    );
}


async function apiFetch(url, options = {}) {

    const token = getToken();

    const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    if (token) {
        headers.Authorization = `Bearer ${token}`;
    }

    const response = await fetch(
        API_URL + url,
        {
            ...options,
            headers
        }
    );

    if (response.status === 401) {
        handleUnauthorized();

        throw new Error(
            "Oturumunuz sona erdi."
        );
    }

    return response;
}


loginTab.addEventListener(
    "click",
    () => {

        isRegisterMode = false;

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        authButton.textContent = "Giriş Yap";

        authPassword.autocomplete = "current-password";

        clearStatus(authStatus);
    }
);


registerTab.addEventListener(
    "click",
    () => {

        isRegisterMode = true;

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

        authButton.textContent = "Kayıt Ol";

        authPassword.autocomplete = "new-password";

        clearStatus(authStatus);
    }
);


authForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const username = authUsername.value.trim();
        const password = authPassword.value;

        clearStatus(authStatus);

        authButton.disabled = true;

        authButton.textContent =
            isRegisterMode
                ? "Kayıt olunuyor..."
                : "Giriş yapılıyor...";

        try {

            const endpoint =
                isRegisterMode
                    ? "/auth/register"
                    : "/auth/login";

            const response = await fetch(
                API_URL + endpoint,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {

                throw new Error(
                    data.detail || "Bir hata oluştu."
                );
            }

            localStorage.setItem(
                TOKEN_KEY,
                data.token
            );

            localStorage.setItem(
                USERNAME_KEY,
                data.username
            );

            clearStatus(authStatus);

            showTodos();

        } catch (error) {

            showStatus(
                authStatus,
                error.message,
                "error"
            );

        } finally {

            authButton.disabled = false;

            authButton.textContent =
                isRegisterMode
                    ? "Kayıt Ol"
                    : "Giriş Yap";
        }
    }
);


logoutButton.addEventListener(
    "click",
    logout
);


todoForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const title = todoInput.value.trim();

        if (!title) {
            return;
        }

        clearStatus(todoStatus);

        try {

            const response = await apiFetch(
                "/todos",
                {
                    method: "POST",
                    body: JSON.stringify({
                        title,
                        completed: false
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {

                throw new Error(
                    data.detail || "Görev eklenemedi."
                );
            }

            todoInput.value = "";

            await loadTodos();

            showStatus(
                todoStatus,
                "Görev eklendi.",
                "success"
            );

        } catch (error) {

            if (getToken()) {

                showStatus(
                    todoStatus,
                    error.message,
                    "error"
                );
            }
        }
    }
);


async function loadTodos() {

    loading.classList.remove("hidden");

    try {

        const response = await apiFetch(
            "/todos"
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail || "Görevler alınamadı."
            );
        }

        todos = data;

        renderTodos();

    } catch (error) {

        if (getToken()) {

            showStatus(
                todoStatus,
                error.message,
                "error"
            );
        }

    } finally {

        loading.classList.add("hidden");
    }
}


function renderTodos() {

    todoList.innerHTML = "";

    if (todos.length === 0) {

        const empty = document.createElement("li");

        empty.className = "empty";

        empty.textContent =
            "Henüz hiç görevin yok. İlk görevini ekle!";

        todoList.appendChild(empty);

    } else {

        todos.forEach(
            (todo) => {

                const item =
                    document.createElement("li");

                item.className = "todo-item";

                if (todo.completed) {
                    item.classList.add("completed");
                }


                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.className = "todo-checkbox";
                checkbox.checked = todo.completed;


                checkbox.addEventListener(
                    "change",
                    () => {
                        updateTodo(
                            todo.id,
                            todo.title,
                            checkbox.checked
                        );
                    }
                );


                const title =
                    document.createElement("span");

                title.className = "todo-title";
                title.textContent = todo.title;


                const actions =
                    document.createElement("div");

                actions.className = "todo-actions";


                const editButton =
                    document.createElement("button");

                editButton.className = "edit-btn";
                editButton.textContent = "Düzenle";


                editButton.addEventListener(
                    "click",
                    () => {
                        editTodo(todo);
                    }
                );


                const deleteButton =
                    document.createElement("button");

                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Sil";


                deleteButton.addEventListener(
                    "click",
                    () => {
                        deleteTodo(todo.id);
                    }
                );


                actions.appendChild(editButton);
                actions.appendChild(deleteButton);

                item.appendChild(checkbox);
                item.appendChild(title);
                item.appendChild(actions);

                todoList.appendChild(item);
            }
        );
    }

    updateStats();
}


function updateStats() {

    const total = todos.length;

    const completed =
        todos.filter(
            todo => todo.completed
        ).length;

    const remaining =
        total - completed;

    totalCount.textContent = total;
    completedCount.textContent = completed;
    remainingCount.textContent = remaining;
}


async function updateTodo(
    id,
    title,
    completed
) {

    try {

        const response = await apiFetch(
            `/todos/${id}`,
            {
                method: "PUT",
                body: JSON.stringify({
                    title,
                    completed
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail || "Görev güncellenemedi."
            );
        }

        const index =
            todos.findIndex(
                todo => todo.id === id
            );

        if (index !== -1) {
            todos[index] = data;
        }

        renderTodos();

    } catch (error) {

        if (getToken()) {

            showStatus(
                todoStatus,
                error.message,
                "error"
            );
        }

        await loadTodos();
    }
}


async function editTodo(todo) {

    const newTitle =
        prompt(
            "Görevi düzenle:",
            todo.title
        );

    if (newTitle === null) {
        return;
    }

    const title = newTitle.trim();

    if (!title) {

        showStatus(
            todoStatus,
            "Görev boş bırakılamaz.",
            "error"
        );

        return;
    }

    await updateTodo(
        todo.id,
        title,
        todo.completed
    );
}


async function deleteTodo(id) {

    const confirmed =
        confirm(
            "Bu görevi silmek istediğine emin misin?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response = await apiFetch(
            `/todos/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail || "Görev silinemedi."
            );
        }

        todos =
            todos.filter(
                todo => todo.id !== id
            );

        renderTodos();

        showStatus(
            todoStatus,
            "Görev silindi.",
            "success"
        );

    } catch (error) {

        if (getToken()) {

            showStatus(
                todoStatus,
                error.message,
                "error"
            );
        }
    }
}


if (getToken() && getUsername()) {
    showTodos();
} else {
    showAuth();
}

</script>

</body>
</html>
